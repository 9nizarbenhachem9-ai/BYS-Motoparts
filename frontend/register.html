<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Admin — Web Manajemen Sparepart</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div style="display:flex; justify-content:center; margin-bottom:12px;">
          <div class="brand-icon">⚙️</div>
        </div>
        <h1>Registrasi Admin</h1>
        <p>Buat akun pengelola gudang baru</p>
      </div>

      <form id="registerForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" class="form-control" placeholder="Minimal 3 karakter" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Minimal 8 karakter" required autocomplete="new-password">
        </div>

        <div class="form-group">
          <label for="inviteCode">Kode Undangan (Opsional)</label>
          <input type="text" id="inviteCode" class="form-control" placeholder="Diisi jika server mewajibkannya">
        </div>

        <button type="submit" class="btn btn-primary btn-block">Daftarkan Akun</button>
      </form>

      <div class="auth-footer">
        Sudah memiliki akun? <a href="login.html">Masuk di sini</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      checkAuth(false);
    });
  </script>
</body>
</html>
