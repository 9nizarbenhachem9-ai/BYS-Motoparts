<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Web Manajemen Sparepart</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div style="display:flex; justify-content:center; margin-bottom:12px;">
          <div class="brand-icon">⚙️</div>
        </div>
        <h1>Masuk Admin</h1>
        <p>Aplikasi Manajemen Stok Sparepart Bengkel & Gudang</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" class="form-control" placeholder="Masukkan username" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary btn-block">Masuk ke Dashboard</button>
      </form>

      <div class="auth-footer">
        Belum punya akun admin? <a href="register.html">Daftar di sini</a>
      </div>
    </div>
  </div>

  <script type="module" src="js/login.js"></script>
</body>
</html>
